[project]
name = "jinx-bot"
version = "0.1.0"
description = "Telegram bot foundation for Prismaxys subscriptions"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiogram>=3.22,<4",
    "aiosqlite>=0.21,<1",
    "pydantic-settings>=2.10,<3",
]

[project.scripts]
jinx-bot = "jinx_bot.main:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.2,<2", "ruff>=0.13,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
