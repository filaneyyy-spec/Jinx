name: Server connectivity

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/server-connectivity.yml

permissions:
  contents: read

jobs:
  ssh-banner:
    name: SSH reachability (${{ matrix.host }})
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        host: ["5.187.0.58", "193.233.223.99"]
    steps:
      - name: Read SSH banner without authentication
        env:
          TARGET_HOST: ${{ matrix.host }}
        shell: python
        run: |
          import os
          import socket

          host = os.environ["TARGET_HOST"]
          with socket.create_connection((host, 22), timeout=10) as connection:
              connection.settimeout(10)
              banner = connection.recv(256).decode("ascii", errors="replace").strip()
          if not banner.startswith("SSH-"):
              raise SystemExit("Port 22 did not return an SSH banner")
          print(f"{host}:22 responds with SSH; no authentication attempted.")
